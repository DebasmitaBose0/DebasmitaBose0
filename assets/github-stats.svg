<svg width="500" height="240" viewBox="0 0 500 240" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    .title { fill: #ff69b4; font-size: 20px; font-weight: 600; font-family: 'Segoe UI', sans-serif; }
    .label { fill: #ffc0cb; font-size: 15px; font-family: 'Segoe UI', sans-serif; }
    .value { fill: #ffffff; font-weight: 600; }
    .ring-bg { stroke: #2a2a2a; stroke-width: 10; fill: none; }
    .ring { stroke: #ff69b4; stroke-width: 10; fill: none; stroke-linecap: round; }
  </style>

  <rect class="bg" width="500" height="240" rx="18"/>

  <text x="250" y="32" text-anchor="middle" class="title">Debasmita Bose • GitHub Stats</text>
  <text x="250" y="52" text-anchor="middle" font-size="10" fill="#8b949e" font-family="Segoe UI, sans-serif">Live data via GitHub API</text>

  <text x="40" y="82" class="label">⭐ Repositories: <tspan class="value">${REPOSITORIES}</tspan></text>
  <text x="40" y="112" class="label">⭐ Stars: <tspan class="value">${STARS}</tspan></text>
  <text x="40" y="142" class="label">👥 Followers: <tspan class="value">${FOLLOWERS}</tspan></text>
  <text x="40" y="172" class="label">📅 Joined: <tspan class="value">${JOINED}</tspan></text>
  <text x="40" y="202" class="label">🕐 Updated: <tspan class="value">${UPDATED}</tspan></text>

  <circle cx="400" cy="140" r="42" class="ring-bg"/>
  <circle cx="400" cy="140" r="42" class="ring" stroke-dasharray="264" stroke-dashoffset="${RING_OFFSET}" transform="rotate(-90 400 140)"/>
  <text x="400" y="136" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="700" font-family="Segoe UI, sans-serif">${GRADE}</text>
  <text x="400" y="154" text-anchor="middle" font-size="10" fill="#8b949e" font-family="Segoe UI, sans-serif">PROFILE SCORE</text>
</svg>
