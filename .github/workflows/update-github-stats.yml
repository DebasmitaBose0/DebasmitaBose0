name: Update GitHub Profile Stats

on:
  push:
    paths-ignore:
      - "assets/contribution-graph-pink.svg"
      - "data/contributions.json"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch real contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-contributions.js

      - name: Generate contribution graph
        run: node scripts/generate-svg.js

      - name: Commit updated contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-graph-pink.svg data/contributions.json
          if git diff --cached --quiet; then
            echo "No contribution changes to commit."
          else
            git commit -m "chore: update live contribution graph"
            git push
          fi
