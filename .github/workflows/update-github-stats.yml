name: Update GitHub Profile Stats

on:
  push:
    paths-ignore:
      - "assets/github-stats.svg"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update live stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-github-stats.js

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          if git diff --cached --quiet; then
            echo "No stats changes to commit."
          else
            git commit -m "chore: update live GitHub profile stats"
            git push
          fi
